name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applymate_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: applymate_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applymate_test -d applymate_foundation_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Validate BroCalc
        run: npm run check

      - name: Validate ApplyMate
        run: npm run check:applymate
        env:
          APPLYMATE_TEST_DATABASE_URL: postgresql://applymate_test:synthetic-ci-only@127.0.0.1:5432/applymate_foundation_test

      - name: Validate infrastructure template
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/applymate-pilot.bicep --stdout > /dev/null
          az bicep build --file infra/applymate-runtime.bicep --stdout > /dev/null
